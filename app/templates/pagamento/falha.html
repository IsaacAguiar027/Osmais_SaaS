{% extends "base.html" %}
{% block title %}— Pagamento não aprovado{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14"/></svg>
  </div>
  <h1 class="text-xl font-medium text-gray-800 mb-2">Pagamento não aprovado</h1>
  <p class="text-sm text-gray-500 mb-6">Houve um problema com seu pagamento. Tente novamente.</p>
  <a href="{{ url_for('pagamento.planos') }}"
     class="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-sm hover:bg-gray-800 transition-colors">
    Tentar novamente
  </a>
</div>
{% endblock %}
