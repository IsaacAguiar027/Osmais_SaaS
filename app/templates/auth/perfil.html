{% extends "base.html" %}
{% block title %}— Meu Perfil{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-xl font-medium text-gray-800">Meu Perfil</h1>
  <p class="text-sm text-gray-500 mt-0.5">Gerencie os dados da sua conta</p>
</div>

<div class="grid grid-cols-2 gap-5 max-w-3xl">

  <!-- Dados da conta -->
  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="text-sm font-medium text-gray-700 mb-5 flex items-center gap-2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 16 16">
        <circle cx="8" cy="6" r="3"/><path d="M2 14c0-3.3 2.7-5 6-5s6 1.7 6 5"/>
      </svg>
      Dados da conta
    </h2>

    <form method="POST">
      <input type="hidden" name="acao" value="dados">

      <div class="mb-4">
        <label class="block text-xs text-gray-500 mb-1">Nome da loja</label>
        <input type="text" name="nome_loja" required value="{{ current_user.nome_loja }}"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p class="text-xs text-gray-400 mt-1">Aparece no cabeçalho dos orçamentos.</p>
      </div>

      <div class="mb-5">
        <label class="block text-xs text-gray-500 mb-1">Email</label>
        <input type="email" name="email" required value="{{ current_user.email }}"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
        class="bg-gray-900 text-white px-5 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">
        Salvar dados
      </button>
    </form>
  </div>

  <!-- Alterar senha -->
  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="text-sm font-medium text-gray-700 mb-5 flex items-center gap-2">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 16 16">
        <rect x="3" y="7" width="10" height="8" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/>
      </svg>
      Alterar senha
    </h2>

    <form method="POST">
      <input type="hidden" name="acao" value="senha">

      <div class="mb-4">
        <label class="block text-xs text-gray-500 mb-1">Senha atual</label>
        <input type="password" name="senha_atual" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-4">
        <label class="block text-xs text-gray-500 mb-1">Nova senha</label>
        <input type="password" name="nova_senha" required minlength="6"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-5">
        <label class="block text-xs text-gray-500 mb-1">Confirmar nova senha</label>
        <input type="password" name="confirmar" required minlength="6"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
        class="bg-gray-900 text-white px-5 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">
        Alterar senha
      </button>
    </form>
  </div>

</div>
{% endblock %}
