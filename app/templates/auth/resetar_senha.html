<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OSmais — Nova senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-medium text-white">OS<span class="text-blue-400">mais</span></h1>
      <p class="text-gray-400 text-sm mt-2">Criar nova senha</p>
    </div>

    <div class="bg-white rounded-xl p-8 shadow-xl">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg text-sm
              {% if category == 'erro' %}bg-red-50 text-red-700 border border-red-200
              {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
          <input type="password" name="senha" required minlength="6" autofocus
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar nova senha</label>
          <input type="password" name="confirmar" required minlength="6"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
          class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
          Salvar nova senha
        </button>
      </form>
    </div>
  </div>
</body>
</html>
