<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OSmais — Esqueceu a senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-medium text-white">OS<span class="text-blue-400">mais</span></h1>
      <p class="text-gray-400 text-sm mt-2">Recuperar acesso</p>
    </div>

    <div class="bg-white rounded-xl p-8 shadow-xl">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg text-sm
              {% if category == 'erro' %}bg-red-50 text-red-700 border border-red-200
              {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <p class="text-sm text-gray-600 mb-5">
        Digite o email da sua conta e enviaremos um link para redefinir sua senha.
      </p>

      <form method="POST">
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required autofocus
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
          class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
          Enviar link de recuperação
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-blue-500 hover:underline">← Voltar ao login</a>
      </p>
    </div>
  </div>
</body>
</html>
