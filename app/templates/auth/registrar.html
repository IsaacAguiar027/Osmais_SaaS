<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OSmais — Criar Conta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-medium text-white">OS<span class="text-blue-400">mais</span></h1>
      <p class="text-gray-400 text-sm mt-2">Crie sua conta grátis</p>
    </div>

    <div class="bg-white rounded-xl p-8 shadow-xl">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 px-4 py-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Seu nome</label>
          <input type="text" name="nome" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome da loja</label>
          <input type="text" name="nome_loja" required placeholder="Ex: Assistência do João, TechFix..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-xs text-gray-400 mt-1">Aparece no cabeçalho dos seus orçamentos.</p>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" name="senha" required minlength="6"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
          class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
          Criar conta
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-4">
        Já tem conta?
        <a href="{{ url_for('auth.login') }}" class="text-blue-500 hover:underline">Entrar</a>
      </p>
    </div>
  </div>

</body>
</html>
