{% extends "base.html" %}
{% block title %}— Novo Cliente{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
  <a href="{{ url_for('clientes.lista') }}" class="text-gray-400 hover:text-gray-600">← Voltar</a>
  <h1 class="text-xl font-medium text-gray-800">Novo Cliente</h1>
</div>

<div class="bg-white rounded-xl border border-gray-200 p-6 max-w-lg">
  <form method="POST">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
      <input type="text" name="nome" required
        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
      <input type="text" name="telefone" placeholder="(00) 00000-0000"
        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email"
        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <button type="submit"
      class="bg-gray-900 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
      Cadastrar
    </button>
  </form>
</div>
{% endblock %}
